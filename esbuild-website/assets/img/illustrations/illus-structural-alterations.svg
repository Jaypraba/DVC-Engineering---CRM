<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#033072" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#033072" stroke-opacity=".28" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#EDF2F8"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#033072" stroke-linecap="square" stroke-linejoin="miter">

    <!-- retained wall over -->
    <path d="M120 200h560v100H120z" stroke-opacity=".5" stroke-width="2"/>
    <line x1="120" y1="224" x2="680" y2="224" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="120" y1="248" x2="680" y2="248" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="120" y1="272" x2="680" y2="272" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="120" y1="296" x2="680" y2="296" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M120 300v220" stroke-opacity=".5" stroke-width="2"/>
    <path d="M680 300v220" stroke-opacity=".5" stroke-width="2"/>

    <!-- masonry removed below the new beam -->
    <path d="M288 362h224v158H288z" stroke-dasharray="9 7" stroke-opacity=".4" stroke-width="2"/>

    <!-- new steel beam, shown in elevation with its flanges marked -->
    <rect x="222" y="300" width="356" height="62" fill="#033072" stroke="none"/>
    <line x1="222" y1="313" x2="578" y2="313" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="222" y1="349" x2="578" y2="349" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>

    <!-- padstones bearing onto the retained piers -->
    <rect x="222" y="362" width="66" height="40" fill="#033072" stroke="none"/>
    <rect x="512" y="362" width="66" height="40" fill="#033072" stroke="none"/>
    <path d="M222 402h66v118h-66z" stroke-opacity=".5" stroke-width="2"/>
    <path d="M512 402h66v118h-66z" stroke-opacity=".5" stroke-width="2"/>

    <!-- load transferred to the new beam -->
    <path d="M270 210v58M263 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>
    <path d="M328 210v58M321 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>
    <path d="M386 210v58M379 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>
    <path d="M444 210v58M437 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>
    <path d="M502 210v58M495 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>
    <path d="M560 210v58M553 258l7 10 7-10" stroke-opacity=".45" stroke-width="2"/>

    <line x1="90" y1="520" x2="710" y2="520" stroke-opacity=".62" stroke-width="2.5"/>
    <rect x="90" y="520" width="620" height="14" fill="url(#hatch)" stroke="none"/>
    <line x1="228" y1="552" x2="228" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="572" y1="552" x2="572" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="228" y1="562" x2="572" y2="562" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M231 558L240 562L231 566" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M569 558L560 562L569 566" stroke-opacity=".34" stroke-width="1.3"/>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#033072" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#033072" stroke-opacity=".28" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#EDF2F8"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#033072" stroke-linecap="square" stroke-linejoin="miter">

    <!-- shell retained -->
    <path d="M188 252V520H612V252" stroke-opacity=".5" stroke-width="2"/>
    <path d="M160 260L400 148L640 260" stroke-opacity=".5" stroke-width="2"/>
    <line x1="188" y1="386" x2="612" y2="386" stroke-opacity=".5" stroke-width="2"/>
    <line x1="188" y1="252" x2="612" y2="252" stroke-opacity=".5" stroke-width="2"/>

    <!-- renewed interior: rooms rebuilt -->
    <rect x="212" y="278" width="150" height="88" fill="#033072" stroke="none"/>
    <rect x="438" y="278" width="150" height="88" fill="#033072" stroke="none"/>
    <rect x="212" y="410" width="150" height="90" fill="#033072" stroke="none"/>
    <rect x="438" y="410" width="150" height="90" fill="#033072" stroke="none"/>
    <line x1="212" y1="322" x2="362" y2="322" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="438" y1="322" x2="588" y2="322" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="287" y1="410" x2="287" y2="500" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="513" y1="410" x2="513" y2="500" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>

    <!-- new staircase between floors -->
    <path d="M378 500v-20h22v-22h22v-22h22v-22h22v-28" stroke-opacity=".6" stroke-width="2.5"/>
    <path d="M378 366v-18h22v-22h22v-22h22v-26" stroke-opacity=".6" stroke-width="2.5"/>

    <!-- renewed roof covering -->
    <path d="M176 254L400 150l224 104" stroke-opacity=".62" stroke-width="5"/>

    <line x1="50" y1="520" x2="750" y2="520" stroke-opacity=".62" stroke-width="2.5"/>
    <rect x="50" y="520" width="700" height="14" fill="url(#hatch)" stroke="none"/>
    <line x1="188" y1="552" x2="188" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="612" y1="552" x2="612" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="188" y1="562" x2="612" y2="562" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M191 558L200 562L191 566" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M609 558L600 562L609 566" stroke-opacity=".34" stroke-width="1.3"/>

  </g>
</svg>

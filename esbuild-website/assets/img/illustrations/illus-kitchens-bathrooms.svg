<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#033072" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#033072" stroke-opacity=".28" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#EDF2F8"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <g fill="none" stroke="#033072" stroke-linecap="square" stroke-linejoin="miter">

    <line x1="80" y1="128" x2="720" y2="128" stroke-opacity=".5" stroke-width="2"/>
    <line x1="80" y1="128" x2="80" y2="520" stroke-opacity=".5" stroke-width="2"/>
    <line x1="720" y1="128" x2="720" y2="520" stroke-opacity=".5" stroke-width="2"/>

    <!-- run of base units and worktop -->
    <rect x="118" y="404" width="300" height="116" fill="#033072" stroke="none"/>
    <rect x="110" y="390" width="316" height="16" fill="#033072" stroke="none"/>
    <line x1="193" y1="420" x2="193" y2="508" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="268" y1="420" x2="268" y2="508" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="343" y1="420" x2="343" y2="508" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>
    <line x1="118" y1="440" x2="418" y2="440" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>

    <!-- wall units -->
    <rect x="118" y="206" width="182" height="100" fill="#033072" stroke="none"/>
    <line x1="209" y1="212" x2="209" y2="300" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>

    <!-- tall unit -->
    <rect x="446" y="206" width="86" height="314" fill="#033072" stroke="none"/>
    <line x1="446" y1="330" x2="532" y2="330" stroke="#EDF2F8" stroke-opacity=".55" stroke-width="2"/>

    <!-- sink and tap -->
    <rect x="180" y="360" width="86" height="30" stroke-opacity=".5" stroke-width="2"/>
    <path d="M223 360v-34h30" stroke-opacity=".6" stroke-width="3"/>

    <!-- window -->
    <rect x="318" y="206" width="108" height="128" stroke-opacity=".5" stroke-width="2"/>
    <line x1="372" y1="206" x2="372" y2="334" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="318" y1="270" x2="426" y2="270" stroke-opacity=".34" stroke-width="1.3"/>

    <!-- bath -->
    <path d="M568 428h134v70a18 18 0 0 1-18 18h-98a18 18 0 0 1-18-18z" stroke-opacity=".5" stroke-width="2"/>
    <path d="M596 428v-16h78v16" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M635 412v-26h26" stroke-opacity=".6" stroke-width="3"/>

    <line x1="80" y1="520" x2="720" y2="520" stroke-opacity=".62" stroke-width="2.5"/>
    <rect x="80" y="520" width="640" height="14" fill="url(#hatch)" stroke="none"/>
    <line x1="110" y1="552" x2="110" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="426" y1="552" x2="426" y2="572" stroke-opacity=".34" stroke-width="1.3"/>
    <line x1="110" y1="562" x2="426" y2="562" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M113 558L122 562L113 566" stroke-opacity=".34" stroke-width="1.3"/>
    <path d="M423 558L414 562L423 566" stroke-opacity=".34" stroke-width="1.3"/>

  </g>
</svg>
